<style>
  :root {
    --ground: #1c1a18;
    --parchment: #e8dcbd;
    --faded: #9c9893;
    --vermilion: #d7301f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ground);
    color: var(--parchment);
    font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 16px 32px;
    text-align: center;
  }
  h1 { margin: 0; line-height: 0; }
  h1 img { width: min(88vw, 640px); height: auto; }
  .line {
    max-width: 34rem;
    margin: 2.25rem 0 0;
    font-size: clamp(1.1rem, 2.6vw, 1.35rem);
    line-height: 1.5;
  }
  .follow {
    margin: 2.5rem 0 0.75rem;
    color: var(--faded);
    font-size: 0.95rem;
    letter-spacing: 0.04em;
  }
  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6rem 1.5rem;
  }
  nav a {
    color: var(--parchment);
    text-decoration: none;
    font-size: 1.05rem;
    border-bottom: 1px solid rgba(232, 220, 189, 0.3);
    padding-bottom: 2px;
  }
  nav a:hover { border-bottom-color: var(--vermilion); }
  nav a:focus-visible { outline: 2px solid var(--vermilion); outline-offset: 4px; }
  footer {
    padding: 0 16px 28px;
    text-align: center;
    color: var(--faded);
    font-size: 0.85rem;
  }
</style>
</head>

    </ul>
  </nav>
